<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dutch Tutor 安卓实测</title>
    <style>
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        margin: 0;
        padding: max(12px, env(safe-area-inset-top)) 12px 32px;
        background: #f6f4ef;
        color: #222;
      }
      h1 {
        font-size: 18px;
        margin: 8px 0;
      }
      section {
        background: #fff;
        border-radius: 10px;
        padding: 10px 12px;
        margin: 10px 0;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 6px;
      }
      button {
        font-size: 15px;
        padding: 8px 14px;
        margin: 4px 4px 4px 0;
        border-radius: 8px;
        border: 1px solid #888;
        background: #fff;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 12px;
        margin: 6px 0 0;
      }
      audio {
        width: 100%;
        margin-top: 6px;
      }
      .ok {
        color: #1a7f37;
      }
      .bad {
        color: #c62828;
      }
    </style>
  </head>
  <body>
    <h1>Dutch Tutor 安卓实测（临时页面）</h1>
    <section>
      <h2>H 正式手机界面（看安全区）</h2>
      <button id="h-run">打开正式界面</button>
      <pre>看顶部状态栏、底部手势条有没有挡住内容。彻底关掉再打开会回到本页。</pre>
    </section>
    <section>
      <h2>G 启动耗时</h2>
      <pre id="g">测量中…</pre>
    </section>
    <section>
      <h2>B 数据库</h2>
      <pre id="b">检查中…</pre>
    </section>
    <section>
      <h2>C 麦克风</h2>
      <button id="c-run">录 3 秒</button>
      <pre id="c">点按钮开始；第一次会弹出麦克风权限请求。</pre>
      <audio id="c-raw" controls hidden></audio>
      <audio id="c-wav" controls hidden></audio>
    </section>
    <section>
      <h2>D 大资料包复制</h2>
      <button id="d-run">从安装包复制到手机存储</button>
      <pre id="d">约 350MB，可能要等十几秒。</pre>
    </section>
    <section>
      <h2>E 联网（Azure，假密钥）</h2>
      <button id="e-run">测试连接</button>
      <pre id="e">显示“密钥无效”就算通。</pre>
    </section>
    <section>
      <h2>F 播放应用数据里的音频</h2>
      <button id="f-run">播放</button>
      <pre id="f">先做 C（录音会存进应用数据）和 D（复制示例音频）。</pre>
      <audio id="f-rec" controls hidden></audio>
      <audio id="f-pack" controls hidden></audio>
    </section>
    <section>
      <h2>环境</h2>
      <pre id="env"></pre>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
