name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 前端：类型检查 · lint · 单元测试 · 内容校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: 内容校验（仓库内容 + 假资料包）
        run: |
          npm run validate
          npm run validate -- --pack fixtures/nn-pack
          npm run validate -- --content fixtures/content --pack fixtures/nn-pack
      - run: npm run build

  windows:
    name: Windows：内容完整校验（--pack）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 完整校验（反斜杠路径、绝对路径、默认报告文件）
        run: |
          npm run validate -- --content fixtures\content --pack "$PWD\fixtures\nn-pack"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path validate-report.md)) { Write-Error "没有生成 validate-report.md"; exit 1 }
          npm run validate -- --pack fixtures\nn-pack --report "$env:RUNNER_TEMP\报告.md"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content "$env:RUNNER_TEMP\报告.md" -Encoding utf8 -TotalCount 3
      - name: 校验脚本的单元测试
        run: npx vitest run scripts

  rust:
    name: 后端：格式 · clippy · 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - name: Windows 目标编译检查（含 WebView2 麦克风权限代码）
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
          cargo clippy --target x86_64-pc-windows-gnu -- -D warnings
        working-directory: src-tauri
