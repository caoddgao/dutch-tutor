name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows 安装包（NSIS）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Next version (1.0.x)
        id: version
        shell: bash
        run: echo "version=$(node scripts/version.mjs --write)" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: Dutch Tutor ${{ steps.version.outputs.version }}
          # x.y.0 (e.g. 1.0.0) is a formal release; later builds from main (1.0.1, 1.0.2 …) are test builds
          releaseBody: |
            ${{ endsWith(steps.version.outputs.version, '.0') && '正式版' || '测试版' }} ${{ steps.version.outputs.version }}。
            下载下面的 `Dutch.Tutor_${{ steps.version.outputs.version }}_x64-setup.exe`，双击安装。
          releaseDraft: false
          prerelease: ${{ !endsWith(steps.version.outputs.version, '.0') }}
          args: --bundles nsis
