[package]
name = "dutch-tutor"
version = "0.1.0"
description = "Dutch Tutor"
authors = ["Dutch Tutor"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "dutch_tutor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
